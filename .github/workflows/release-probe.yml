name: Release probe

# A throw-away check of what the workflow's token may do with releases and tags. It deletes everything it makes. It starts when
# .github/release-probe.json changes on a claude/* branch (to find out why GitHub refused to make a release; remove it when that is known).

on:
  push:
    branches: ["claude/**"]
    paths: [".github/release-probe.json"]

permissions:
  contents: write

jobs:
  probe:
    name: What the token may do with releases and tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The real script, standalone
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -u
          node scripts/release-assets.mjs create --tag v0.0.1-probe-j --target "${GITHUB_SHA}" --title "probe j" --prerelease
          ID=$(grep '^release_id=' "${GITHUB_OUTPUT}" | cut -d= -f2)
          echo "made number ${ID}"
          if [ -n "${ID}" ]; then curl -sS -o /dev/null -w 'DELETE -> %{http_code}\n' -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/releases/${ID}"; fi
      - name: Which commits may be a release target
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -u
          git fetch --no-tags --depth=30 origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          for C in $(git rev-list -n 16 HEAD); do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/releases" -d "{\"tag_name\":\"v0.0.1-probe-c\",\"target_commitish\":\"${C}\",\"draft\":true,\"name\":\"probe c\"}")
            ID=$(jq -r '.id // empty' /tmp/out)
            if [ -n "${ID}" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/releases/${ID}"; fi
            curl -sS -o /tmp/c -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/git/commits/${C}"
            tcode=$(curl -sS -o /tmp/t -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/git/refs" -d "{\"ref\":\"refs/tags/probe-t\",\"sha\":\"${C}\"}")
            if [ "${tcode}" = "201" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${R}/git/refs/tags/probe-t"; fi
            echo "${C:0:7} release=${code} tag=${tcode} $(jq -c '{a: .author.name, c: .committer.name, date: .committer.date, v: .verification.reason, parents: (.parents|length)}' /tmp/c)"
          done
      - name: Try it
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          call() { code=$(curl -sS -o /tmp/out -w '%{http_code}' -X "$1" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com$2" ${3:+-d "$3"}); echo "$1 $2 -> ${code}"; }
          call GET "/repos/${R}"
          jq '{private, fork, archived, visibility, default_branch, permissions, owner: .owner.type}' /tmp/out
          try() {
            call POST "/repos/${R}/releases" "$2"
            echo "  ($1) $(jq -c '{id, message, errors}' /tmp/out)"
            ID=$(jq -r '.id // empty' /tmp/out)
            if [ -n "${ID}" ]; then call DELETE "/repos/${R}/releases/${ID}"; fi
          }
          try "A: a draft, target = the commit" "{\"tag_name\":\"probe-a\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"name\":\"probe a\"}"
          try "B: a draft, target = this branch" "{\"tag_name\":\"probe-b\",\"target_commitish\":\"${BRANCH}\",\"draft\":true,\"name\":\"probe b\"}"
          try "C: a draft, target = main" "{\"tag_name\":\"probe-c\",\"target_commitish\":\"main\",\"draft\":true,\"name\":\"probe c\"}"
          try "D: a draft, no target" "{\"tag_name\":\"probe-d\",\"draft\":true,\"name\":\"probe d\"}"
          try "G: a draft whose tag name starts with v" "{\"tag_name\":\"v0.0.1-probe\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"name\":\"probe g\"}"
          try "H: the same, a pre-release with notes, as the real run asks" "{\"tag_name\":\"v0.0.1-probe-h\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"prerelease\":true,\"name\":\"probe h\",\"body\":\"The release files are being built.\"}"
          try "L: the exact values of the failed run (tag v1.0.0-trial4, commit 9407a77)" "{\"tag_name\":\"v1.0.0-trial4\",\"target_commitish\":\"9407a77a819627b01e3f5df2711f75952aa9b09d\",\"draft\":true,\"prerelease\":true,\"name\":\"probe l\",\"body\":\"x\"}"
          try "M: tag v1.0.0-trial4, this commit" "{\"tag_name\":\"v1.0.0-trial4\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"prerelease\":true,\"name\":\"probe m\",\"body\":\"x\"}"
          try "N: another tag name, commit 9407a77" "{\"tag_name\":\"v0.0.1-probe-n\",\"target_commitish\":\"9407a77a819627b01e3f5df2711f75952aa9b09d\",\"draft\":true,\"prerelease\":true,\"name\":\"probe n\",\"body\":\"x\"}"
          try "O: tag v1.0.0, this commit" "{\"tag_name\":\"v1.0.0\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"name\":\"probe o\"}"
          call GET "/repos/${R}/git/matching-refs/tags"
          echo "  tags that exist: $(jq -c '[.[]?.ref]' /tmp/out)"
          call GET "/repos/${R}/releases?per_page=10"
          echo "  releases that exist: $(jq -c '[.[]? | {tag_name, draft}]' /tmp/out)"
          # P: the whole life of a release at the commit this run was started for: draft, one file, publish (this is what makes the tag), then remove release and tag again
          call POST "/repos/${R}/releases" "{\"tag_name\":\"v0.0.1-probe-p\",\"target_commitish\":\"${SHA}\",\"draft\":true,\"prerelease\":true,\"name\":\"probe p\"}"
          PID=$(jq -r '.id // empty' /tmp/out); UP=$(jq -r '.upload_url // empty' /tmp/out | sed 's/{.*//')
          echo "  (P: draft) id=${PID}"
          if [ -n "${PID}" ]; then
            echo hello > /tmp/probe.txt
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/octet-stream" "${UP}?name=probe.txt" --data-binary @/tmp/probe.txt); echo "  (P: upload a file) -> ${code}"
            call PATCH "/repos/${R}/releases/${PID}" '{"draft":false}'
            echo "  (P: publish) $(jq -c '{draft, tag_name, message}' /tmp/out)"
            call GET "/repos/${R}/git/ref/tags/v0.0.1-probe-p"
            echo "  (P: the tag points at) $(jq -r '.object.sha // .message' /tmp/out) (this run: ${SHA})"
            call DELETE "/repos/${R}/releases/${PID}"
            call DELETE "/repos/${R}/git/refs/tags/v0.0.1-probe-p"
          fi
          call POST "/repos/${R}/git/refs" "{\"ref\":\"refs/tags/v0.0.1-probe-i\",\"sha\":\"${SHA}\"}"
          echo "  (I: a tag whose name starts with v) $(jq -c '{ref, message}' /tmp/out)"
          call DELETE "/repos/${R}/git/refs/tags/v0.0.1-probe-i"
          call GET "/repos/${R}/tags/protection"
          jq -c '.' /tmp/out | head -c 400; echo
          call POST "/repos/${R}/git/refs" "{\"ref\":\"refs/tags/probe-f\",\"sha\":\"${SHA}\"}"
          echo "  (F: a tag at the commit) $(jq -c '{ref, message}' /tmp/out)"
          call DELETE "/repos/${R}/git/refs/tags/probe-f"
          call GET "/repos/${R}/actions/permissions/workflow"
          cat /tmp/out; echo
          call GET "/repos/${R}/rulesets"
          jq -c '.' /tmp/out | head -c 600; echo

  called:
    name: The same, called from another workflow
    uses: ./.github/workflows/release-probe-inner.yml
    permissions:
      contents: write

name: Release

# Builds the release files and publishes them as a GitHub Release.
#   - push a tag such as v1.0.0 (or v1.0.0-rc1 for a trial release), or
#   - run it by hand from the Actions tab and choose the brand kit.
# Android signing keys (optional, repository secrets): ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them the app is signed with a one-off TEST key: fine for trying it on a phone, not for a store.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kit:
        description: "Brand kit folder under brand-kits/"
        default: "smart-avenue-99"
      version_name:
        description: "Version shown to people, for example 1.0.0"
        default: "1.0.0"
      version_code:
        description: "Whole number, higher for every release"
        default: "1"

permissions:
  contents: write

env:
  KIT: ${{ inputs.kit || 'smart-avenue-99' }}
  VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
  VERSION_CODE: ${{ inputs.version_code || '1' }}

jobs:
  gate:
    name: Release gate (all checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci --ignore-scripts
        working-directory: apps/storefront-web-mobile
      - run: npx prisma generate
        working-directory: apps/storefront-web-mobile
      - uses: ./.github/actions/gate-tools
      - run: node scripts/verify-all.mjs --full

  android:
    name: Android app (APK and AAB)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/storefront-web-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm ci
      - name: Read the brand kit
        id: kit
        run: |
          set -euo pipefail
          KIT_DIR="../../brand-kits/${KIT}"
          test -f "${KIT_DIR}/brand.json" || { echo "No such brand kit: ${KIT}"; exit 1; }
          echo "app_id=$(jq -r '.android.appId' ${KIT_DIR}/brand.json)" >> "$GITHUB_OUTPUT"
          echo "app_name=$(jq -r '.name' ${KIT_DIR}/brand.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.android.storefrontUrl' ${KIT_DIR}/brand.json)" >> "$GITHUB_OUTPUT"
          echo "colour=$(jq -r '.primaryColor' ${KIT_DIR}/brand.json)" >> "$GITHUB_OUTPUT"
          echo "logo=${KIT_DIR}/$(jq -r '.logo' ${KIT_DIR}/brand.json)" >> "$GITHUB_OUTPUT"
      - name: Set the app up for this customer
        env:
          APP_ID: ${{ steps.kit.outputs.app_id }}
          APP_NAME: ${{ steps.kit.outputs.app_name }}
          STOREFRONT_URL: ${{ steps.kit.outputs.url }}
          BRAND_COLOUR: ${{ steps.kit.outputs.colour }}
          BRAND_LOGO: ${{ steps.kit.outputs.logo }}
        run: |
          node scripts/android-config.mjs --app-id "${APP_ID}" --app-name "${APP_NAME}" --url "${STOREFRONT_URL}" --version-name "${VERSION_NAME}" --version-code "${VERSION_CODE}"
          node scripts/make-icons.mjs --logo "${BRAND_LOGO}" --colour "${BRAND_COLOUR}" --android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "SIGNING=release key" >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 16)"
            keytool -genkeypair -v -keystore "${RUNNER_TEMP}/test.keystore" -storepass "${PW}" -keypass "${PW}" -alias test -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Test build, O=NextGenOS" >/dev/null 2>&1
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/test.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${PW}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${PW}" >> "$GITHUB_ENV"
            echo "SIGNING=one-off TEST key" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: apps/storefront-web-mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Check the package
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BT="$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -1)"
          "${BT}/apksigner" verify --print-certs "${APK}"
          # No source files or source maps inside the package.
          if unzip -l "${APK}" | grep -Ei '\.(ts|tsx|map|java|kt|pdb)$'; then echo "Source files found in the APK"; exit 1; fi
          # The app must refuse unencrypted traffic.
          "${BT}/aapt2" dump xmltree --file AndroidManifest.xml "${APK}" | grep -Eq 'usesCleartextTraffic.*(=false|0x0)' || { echo "Cleartext traffic is not disabled"; exit 1; }
      - name: Name the files
        run: |
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../../dist/SmartRetailPOS-${KIT}-${VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "../../dist/SmartRetailPOS-${KIT}-${VERSION_NAME}.aab"
          echo "Signed with: ${SIGNING}" > ../../dist/ANDROID-SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    name: Windows setup for the Business Hub
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the licence keys in (public keys only)
        # The owner's public keys are public data: repository variables NGOS_PUBLIC_KEYS (the text "export-public-keys" prints) and
        # NGOS_LICENCE_URL (the Studio's address). Or they were already built in and committed with "sync-clients". With neither, the build stops.
        shell: bash
        env:
          NGOS_PUBLIC_KEYS: ${{ vars.NGOS_PUBLIC_KEYS }}
          NGOS_LICENCE_URL: ${{ vars.NGOS_LICENCE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${NGOS_PUBLIC_KEYS}" ]; then
            printf '%s' "${NGOS_PUBLIC_KEYS}" > "${RUNNER_TEMP}/keys.json"
            node licensing/studio/src/cli.js apply-public-keys --keys "@${RUNNER_TEMP}/keys.json" --url "${NGOS_LICENCE_URL}"
          fi
      - name: Tools (code obfuscator and setup compiler; build tools, never shipped)
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global Obfuscar.GlobalTool --version 2.2.50
          choco install nsis -y --no-progress
      - name: Build the setup (publish, hide the names, audit, write the setup and the zip)
        shell: bash
        run: node apps/business-hub/installer/build.mjs --version "${VERSION_NAME}" --out dist
      - name: Start the program from the zip and check it refuses to work without a licence
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter 'SmartRetailPOS-Hub-*-win-x64.zip' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'hub-zip'
          New-Item -ItemType Directory -Path $dir | Out-Null
          tar -xf $zip.FullName -C $dir
          node scripts/smoke-hub.mjs (Join-Path $dir 'NextGenOS.Hub.exe')
          if ($LASTEXITCODE -ne 0) { throw 'The published program did not behave.' }
      - name: Install the setup on this Windows PC, check the service, uninstall, check the shop's data stays
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'SmartRetailPOS-Hub-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The setup ended with code $($p.ExitCode)." }
          $svc = Get-Service -Name NextGenOSHub -ErrorAction Stop
          $cfg = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\NextGenOSHub'
          if ($cfg.ObjectName -ne 'NT AUTHORITY\LocalService') { throw "The service runs as $($cfg.ObjectName)." }
          if ($cfg.Start -ne 2 -or $cfg.DelayedAutostart -ne 1) { throw 'The service does not start with the PC (delayed automatic start).' }
          for ($i = 0; $i -lt 60 -and (Get-Service NextGenOSHub).Status -ne 'Running'; $i++) { Start-Sleep -Seconds 2 }
          if ((Get-Service NextGenOSHub).Status -ne 'Running') { Get-WinEvent -LogName Application -MaxEvents 20 | Format-List TimeCreated, ProviderName, Message; throw 'The service did not start.' }
          $code = 0
          for ($i = 0; $i -lt 30; $i++) {
            try { $r = Invoke-WebRequest 'http://127.0.0.1:5280/' -UseBasicParsing -Headers @{ Accept = 'text/html' }; $code = [int]$r.StatusCode }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode; break } }
            if ($code -ne 0) { break }
            Start-Sleep -Seconds 2
          }
          if ($code -ne 402) { throw "With no licence the Hub should answer 402, not $code." }
          $acl = (Get-Acl 'C:\ProgramData\NextGenOS\Hub').Access | ForEach-Object { $_.IdentityReference.Value }
          if ($acl -match 'Users|Everyone|Authenticated Users') { throw "The shop's data folder can be read by: $($acl -join ', ')" }
          Write-Host 'Installed, the service runs, the Hub answers 402 without a licence, the data folder is closed to ordinary users.'
          # Something in the data folder must survive the uninstall.
          Set-Content 'C:\ProgramData\NextGenOS\Hub\keep-me.txt' 'shop data'
          $un = Join-Path $env:ProgramFiles 'NextGenOS\Smart Retail POS Hub\Uninstall.exe'
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $env:ProgramFiles 'NextGenOS\Smart Retail POS Hub\NextGenOS.Hub.exe')); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $env:ProgramFiles 'NextGenOS\Smart Retail POS Hub\NextGenOS.Hub.exe')) { throw 'The uninstall left the program behind.' }
          for ($i = 0; $i -lt 30 -and (Get-Service -Name NextGenOSHub -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 2 }
          if (Get-Service -Name NextGenOSHub -ErrorAction SilentlyContinue) { throw 'The uninstall left the service behind.' }
          if (-not (Test-Path 'C:\ProgramData\NextGenOS\Hub\keep-me.txt')) { throw "The uninstall removed the shop's data." }
          Write-Host "Uninstalled; the service is gone and the shop's data stayed."
      - name: Sign the setup (only when a code-signing certificate is set up)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) { Write-Host 'No signing certificate set (repository secrets WINDOWS_CERT_B64 and WINDOWS_CERT_PASSWORD): the setup is NOT signed; Windows SmartScreen will warn.'; 'NOT signed' | Out-File dist\WINDOWS-SIGNING.txt; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          Get-ChildItem dist -Filter '*Setup*.exe' | ForEach-Object { & $tool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName; if ($LASTEXITCODE -ne 0) { throw 'Signing failed.' } }
          Remove-Item $pfx
          'Signed with the owner certificate' | Out-File dist\WINDOWS-SIGNING.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    name: Publish the GitHub Release
    needs: [gate, android, windows]
    # The release goes out when the gate passed, even if one of the two builds failed: the person testing gets what was built, and the notes say what was not.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: What was built
        env:
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          test -d dist && [ -n "$(ls -A dist)" ] || { echo "Nothing was built, so there is nothing to release."; exit 1; }
          {
            echo "Release gate: success (every check of scripts/verify-all.mjs --full)"
            echo "Windows setup for the Business Hub: ${WINDOWS}"
            echo "Android app: ${ANDROID}"
          } > dist/BUILD-STATUS.txt
          cat dist/BUILD-STATUS.txt
      - name: Checksums
        run: cd dist && sha256sum * | grep -v SHA256SUMS > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "${TAG}" in *-rc*|*-beta*|*-alpha*) PRE="--prerelease";; esac
          { cat .github/release-notes.md; echo; echo "Built from ${GITHUB_SHA}."; echo; echo '```'; cat dist/BUILD-STATUS.txt; echo '```'; } > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" dist/* ${PRE} --repo "${GITHUB_REPOSITORY}" --title "Smart Retail POS ${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
